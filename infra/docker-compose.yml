services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healingram
      POSTGRES_PASSWORD: healingram
      POSTGRES_DB: healingram
    ports:
      - "5432:5432"
    volumes:
      - healingram_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healingram -d healingram"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=healingram;Username=healingram;Password=healingram
      Schema__SqlPath: /app/db/001_schemas.sql
      Schema__ApplyOnStartup: "true"
      Seq__Url: http://seq:80
      OpenTelemetry__OtlpEndpoint: http://jaeger:4317
    ports:
      - "5080:5080"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: infra/docker/gateway.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Seq__Url: http://seq:80
      OpenTelemetry__OtlpEndpoint: http://jaeger:4317
      ReverseProxy__Clusters__monolith__Destinations__api__Address: http://api:5080/
    ports:
      - "5000:5000"
    depends_on:
      - api

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_DEMO_MODE: "true"
    ports:
      - "8080:80"
    depends_on:
      - gateway

volumes:
  healingram_pg:
