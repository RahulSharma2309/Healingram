server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://gateway:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
